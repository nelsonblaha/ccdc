name: Publish site to GitHub Pages

# Serves site/ at https://nelsonblaha.github.io/ccdc/ (or a custom domain).
#
# Requires Pages to be enabled with source "GitHub Actions" in repo settings.
# On a free GitHub plan that also requires the repository to be public — see
# docs/09-publishing.md before flipping visibility, because publishing this repo
# publishes the strategy docs alongside the site.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
